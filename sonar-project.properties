# SonarQube Project Configuration
sonar.projectKey=Calxium_Cuti-dan-Reservasi-Penerbangan-UB-APS
sonar.projectName=Cuti-dan-Reservasi-Penerbangan-UB-APS
sonar.projectVersion=1.0.0

# Source & Test Code
sonar.sources=app
sonar.tests=tests
sonar.inclusions=app/**/*.py
sonar.test.inclusions=tests/**/*.py

# Encoding & Language
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Coverage & Reports
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,app/static/**,instance/**,seed_data.py
